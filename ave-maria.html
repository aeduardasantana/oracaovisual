<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#173b63">
  <title>Ave-Maria Ilustrada - Oração Visual</title>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260917-2"><link rel="stylesheet" href="ave-maria.css?v=20260917-2">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Oração Visual</span></a></header>
<main class="visual-prayer-page">
  <div class="prayer-top"><a href="oracoes-ilustradas.html">← ORAÇÕES ILUSTRADAS</a><div><p class="eyebrow blue">AVE-MARIA</p><h1>Ore com imagens</h1></div><p class="sequence-label" id="sequenceLabel">1 de 7</p></div>
  <section class="visual-stage" aria-live="polite">
    <figure class="prayer-slide active"><span class="slide-number">1</span><img src="https://images.unsplash.com/photo-1749704285461-c6edfaf95b03?auto=format&fit=crop&w=1400&q=90" alt="Anunciação: o anjo Gabriel diante de Maria"><figcaption>Ave Maria, cheia de graça, o Senhor é convosco.</figcaption></figure>
    <figure class="prayer-slide"><span class="slide-number">2</span><img src="https://images.pexels.com/photos/35562054/pexels-photo-35562054.jpeg?auto=compress&cs=tinysrgb&w=1400" alt="Presépio com Maria e o Menino Jesus"><figcaption>Bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus.</figcaption></figure>
    <figure class="prayer-slide"><span class="slide-number">3</span><img src="https://cdn.pixabay.com/photo/2017/08/04/20/06/italy-2581492_1280.jpg" alt="Imagem de Maria, Mãe de Deus"><figcaption>Santa Maria, Mãe de Deus,</figcaption></figure>
    <figure class="prayer-slide"><span class="slide-number">4</span><img src="https://cdn.pixabay.com/photo/2015/10/02/15/00/church-968603_1280.jpg" alt="Imagem de Maria com o Menino Jesus"><figcaption>rogai por nós, pecadores,</figcaption></figure>
    <figure class="prayer-slide"><span class="slide-number">5</span><img src="https://images.pexels.com/photos/12746139/pexels-photo-12746139.jpeg?auto=compress&cs=tinysrgb&w=1400" alt="Estátua católica"><figcaption>agora</figcaption></figure>
    <figure class="prayer-slide"><span class="slide-number">6</span><img src="https://images.pexels.com/photos/20897573/pexels-photo-20897573.jpeg?auto=compress&cs=tinysrgb&w=1400" alt="Pessoa idosa representando a passagem do tempo"><figcaption>e na hora de nossa morte.</figcaption></figure>
    <figure class="prayer-slide"><span class="slide-number">7</span><img src="https://images.unsplash.com/photo-1746297885130-2dfec1e673d4?auto=format&fit=crop&w=1400&q=90" alt="Pessoa em oração"><figcaption>Amém.</figcaption></figure>
  </section>
  <div class="visual-navigation"><button id="prev" type="button" disabled>← ANTERIOR</button><div class="dots" id="dots" aria-label="Sequência da oração"></div><button id="next" type="button">PRÓXIMA →</button></div>
</main>
<div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script><script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
<script>
const slides=[...document.querySelectorAll('.prayer-slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),label=document.getElementById('sequenceLabel'),dots=document.getElementById('dots');let current=0;
slides.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Ir para imagem '+(i+1));b.onclick=()=>show(i);dots.appendChild(b)});
function show(i){current=i;slides.forEach((s,n)=>s.classList.toggle('active',n===i));[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===i));label.textContent=(i+1)+' de '+slides.length;prev.disabled=i===0;next.textContent=i===slides.length-1?'CONCLUIR':'PRÓXIMA →'}
prev.onclick=()=>show(Math.max(0,current-1));next.onclick=()=>current===slides.length-1?location.href='oracoes-ilustradas.html':show(current+1);show(0);
slides.forEach(s=>{const img=s.querySelector('img');img.onerror=()=>{s.classList.add('image-error');img.alt='Imagem temporariamente indisponível';}});
</script>
</body></html>
